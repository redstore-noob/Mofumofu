name: Release Build

# 发布流水线：push v* 标签触发
# Windows 单 exe（含 NekoSolo 载荷打包演示产物）+ macOS dmg + Linux deb/rpm/pkg.tar.zst
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}

permissions:
  contents: write

env:
  DOTNET_VERSION: '10.0.x'
  # 单 exe 会撕掉这些包的 native 依赖，必须保留在磁盘上
  TRIM_SAFE: 'false'
  PROJECT: 'Mofumofu.Launcher/Mofumofu.Launcher.csproj'

jobs:
  # ------------------------------------------------------------------
  # Windows：单文件 exe（框架依赖 + 自包含两份）
  # ------------------------------------------------------------------
  windows:
    name: Windows 单exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # 自包含单 exe：玩家机器免装运行时
      - name: Publish win-x64 single-file (self-contained)
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release -r win-x64
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -p:PublishTrimmed=${{ env.TRIM_SAFE }}
          -o publish/win-x64

      # 框架依赖单 exe：体积小，适合已装 .NET 的用户
      - name: Publish win-x64 single-file (framework-dependent)
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release -r win-x64
          -p:PublishSingleFile=true
          -p:SelfContained=false
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=embedded
          -o publish/win-x64-fdd

      # NekoSolo 安装器：发布 NekoSolo 单 exe，把主启动器发布目录打成载荷 zip 追加到尾部
      # （exe = 安装器本体 + zip 载荷 + 32 字节 NKSOLO1 尾标，见 NekoSolo/FORMAT.md）
      - name: Publish NekoSolo installer
        run: >
          dotnet publish NekoSolo/NekoSolo.csproj -c Release -r win-x64
          -p:PublishSingleFile=true
          -p:SelfContained=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:EnableCompressionInSingleFile=true
          -p:DebugType=embedded
          -o publish/nekosolo

      - name: Build NekoSolo payload package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          # 载荷 zip：主启动器整套发布产物（安装器会在玩家机器上解包它们）
          $stage = "publish/nekosolo-payload"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item publish/win-x64/* $stage -Recurse -Force
          Compress-Archive -Path "$stage/*" -DestinationPath payload.zip -Force

          $exe = "publish/nekosolo/NekoSolo.exe"
          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $zip  = [System.IO.File]::ReadAllBytes("payload.zip")

          # 尾标 32 字节：魔数 "NKSOLO1\x01" + offset(8) + length(8) + crc32(4) + 保留(4)
          $magic = [System.Text.Encoding]::ASCII.GetBytes("NKSOLO1`u{0001}")
          $offset = [int64]$bytes.Length
          $length = [int64]$zip.Length

          # PowerShell 算 CRC32：全程 long 无符号右移，避开 uint32 字面量/转换的有符号坑
          $crcTable = New-Object 'long[]' 256
          for ($i = 0; $i -lt 256; $i++) {
            $c = [long]$i
            for ($k = 0; $k -lt 8; $k++) {
              if (($c -band 1L) -ne 0L) { $c = (0xEDB88320L) -bxor ($c -shr 1L) } else { $c = $c -shr 1L }
            }
            $crcTable[$i] = $c
          }
          $crc32 = 0xFFFFFFFFL
          foreach ($b in $zip) {
            $crc32 = ($crc32 -shr 8L) -bxor $crcTable[[int](($crc32 -bxor [long]$b) -band 0xFFL)]
          }
          $crc32 = $crc32 -bxor 0xFFFFFFFFL
          $crc32u = [uint32]($crc32 -band 0xFFFFFFFFL)

          $trailer = New-Object byte[] 32
          [Array]::Copy($magic, 0, $trailer, 0, 8)
          [Array]::Copy([BitConverter]::GetBytes($offset), 0, $trailer, 8, 8)
          [Array]::Copy([BitConverter]::GetBytes($length), 0, $trailer, 16, 8)
          [Array]::Copy([BitConverter]::GetBytes($crc32u), 0, $trailer, 24, 4)

          $out = New-Object byte[] ($bytes.Length + $zip.Length + 32)
          [Array]::Copy($bytes, 0, $out, 0, $bytes.Length)
          [Array]::Copy($zip, 0, $out, $bytes.Length, $zip.Length)
          [Array]::Copy($trailer, 0, $out, $bytes.Length + $zip.Length, 32)
          [System.IO.File]::WriteAllBytes("dist/NekoSolo-win-x64.exe", $out)
          Write-Host "NekoSolo 打包完成：$($out.Length) 字节，载荷 $($length) 字节，CRC=0x$($crc32u.ToString('X8'))"

      - name: Stage artifacts
        shell: pwsh
        run: |
          # 单文件 Launcher 本体直接作为独立产物（自包含 = 免装运行时；fdd = 体积小）
          Copy-Item publish/win-x64/Mofumofu.Launcher.exe dist/Mofumofu-win-x64.exe
          Copy-Item publish/win-x64-fdd/Mofumofu.Launcher.exe dist/Mofumofu-win-x64-fdd.exe
          # zip 里打包两份 exe（GitHubUpdater 优先挑含 win 的 zip），另附 NekoSolo 安装器
          Compress-Archive -Path publish/win-x64/Mofumofu.Launcher.exe, publish/win-x64-fdd/Mofumofu.Launcher.exe -DestinationPath dist/Mofumofu-win-x64.zip -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            dist/Mofumofu-win-x64.exe
            dist/Mofumofu-win-x64-fdd.exe
            dist/Mofumofu-win-x64.zip
            dist/NekoSolo-win-x64.exe

  # ------------------------------------------------------------------
  # macOS：dmg
  # ------------------------------------------------------------------
  macos:
    name: macOS dmg
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish osx-x64
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release -r osx-x64
          -p:SelfContained=true
          -p:DebugType=embedded
          -o publish/osx-x64

      - name: Publish osx-arm64
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release -r osx-arm64
          -p:SelfContained=true
          -p:DebugType=embedded
          -o publish/osx-arm64

      # 无签名通用地 dmg：手工组装最小 .app bundle（dotnet publish 不产 .app），
      # hdiutil 创建 UDZO 压缩镜像，/Applications 快捷方式 symlink。
      # Info.plist 用 printf 拼，避免 YAML 内 heredoc 缩进坑。
      - name: Build dmg (osx-x64)
        run: |
          APP="dmgroot/Mofumofu.Launcher.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist
          cp -R publish/osx-x64/. "$APP/Contents/MacOS/"
          {
            printf '<?xml version="1.0" encoding="UTF-8"?>\n'
            printf '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n'
            printf '<plist version="1.0">\n<dict>\n'
            printf '  <key>CFBundleName</key><string>Mofumofu</string>\n'
            printf '  <key>CFBundleDisplayName</key><string>Mofumofu Launcher</string>\n'
            printf '  <key>CFBundleIdentifier</key><string>dev.mofumofu.launcher</string>\n'
            printf '  <key>CFBundleVersion</key><string>1.0.0</string>\n'
            printf '  <key>CFBundleShortVersionString</key><string>1.0.0</string>\n'
            printf '  <key>CFBundleExecutable</key><string>Mofumofu.Launcher</string>\n'
            printf '  <key>CFBundlePackageType</key><string>APPL</string>\n'
            printf '  <key>LSHighResolutionCapable</key><true/>\n'
            printf '  <key>NSHighResolutionCapable</key><true/>\n'
            printf '</dict>\n</plist>\n'
          } > "$APP/Contents/Info.plist"
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Mofumofu Launcher" \
            -srcfolder dmgroot -format UDZO -o dist/Mofumofu-macOS-x64.dmg

      - name: Build dmg (osx-arm64)
        run: |
          APP="dmgroot-arm/Mofumofu.Launcher.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources" dist
          cp -R publish/osx-arm64/. "$APP/Contents/MacOS/"
          {
            printf '<?xml version="1.0" encoding="UTF-8"?>\n'
            printf '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">\n'
            printf '<plist version="1.0">\n<dict>\n'
            printf '  <key>CFBundleName</key><string>Mofumofu</string>\n'
            printf '  <key>CFBundleExecutable</key><string>Mofumofu.Launcher</string>\n'
            printf '  <key>CFBundlePackageType</key><string>APPL</string>\n'
            printf '</dict>\n</plist>\n'
          } > "$APP/Contents/Info.plist"
          ln -s /Applications dmgroot-arm/Applications
          hdiutil create -volname "Mofumofu Launcher" \
            -srcfolder dmgroot-arm -format UDZO -o dist/Mofumofu-macOS-arm64.dmg

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            dist/Mofumofu-macOS-x64.dmg
            dist/Mofumofu-macOS-arm64.dmg

  # ------------------------------------------------------------------
  # Linux：deb / rpm / pkg.tar.zst
  # ------------------------------------------------------------------
  linux:
    name: Linux deb/rpm/aur
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish linux-x64
        run: >
          dotnet publish ${{ env.PROJECT }} -c Release -r linux-x64
          -p:SelfContained=true
          -p:DebugType=embedded
          -o publish/linux-x64

      - name: Stage install tree
        run: |
          mkdir -p pkgroot/usr/bin pkgroot/usr/lib/mofumofu
          mkdir -p pkgroot/usr/share/applications
          mkdir -p pkgroot/usr/share/icons/hicolor/512x512/apps
          mkdir -p dist
          cp -R publish/linux-x64/* pkgroot/usr/lib/mofumofu/
          # 入口脚本：Avalonia 需要 libc 的 webkit2gtk 等由发行版包依赖提供
          printf '#!/bin/sh\nexec /usr/lib/mofumofu/Mofumofu.Launcher "$@"\n' > pkgroot/usr/bin/mofumofu
          chmod +x pkgroot/usr/bin/mofumofu
          cp Mofumofu.Launcher/Assets/appicon.png pkgroot/usr/share/icons/hicolor/512x512/apps/mofumofu.png || true

      - name: Build .desktop entry
        run: |
          printf '%s\n' \
            '[Desktop Entry]' \
            'Type=Application' \
            'Name=Mofumofu Launcher' \
            'GenericName=Minecraft Launcher' \
            'Comment=Minecraft launcher based on .NET 10 + Avalonia' \
            'Exec=mofumofu %U' \
            'Icon=mofumofu' \
            'Terminal=false' \
            'Categories=Game;' \
            'StartupWMClass=Mofumofu.Launcher' \
            > pkgroot/usr/share/applications/mofumofu.desktop

      # ---------------- deb ----------------
      - name: Build deb
        run: |
          mkdir -p deb/DEBIAN dist
          VERSION="${GITHUB_REF_NAME#v}"
          {
            printf 'Package: mofumofu\n'
            printf 'Version: %s\n' "$VERSION"
            printf 'Section: games\n'
            printf 'Priority: optional\n'
            printf 'Architecture: amd64\n'
            printf 'Maintainer: redstore-noob <redstore-noob@users.noreply.github.com>\n'
            printf 'Depends: libwebkit2gtk-4.1-0, libayatana-appindicator3-1, libgbm1, libgtk-3-0, openssl\n'
            printf 'Description: Mofumofu Launcher - Minecraft launcher\n'
            printf ' Minecraft launcher based on .NET 10 + Avalonia UI.\n'
          } > deb/DEBIAN/control
          cp -R pkgroot/* deb/
          chmod -R u+rwX,go+rX,go-w deb
          dpkg-deb --build --root-owner-group deb "dist/mofumofu_${VERSION}_amd64.deb"

      # ---------------- rpm ----------------
      - name: Build rpm
        run: |
          sudo apt-get update && sudo apt-get install -y rpm
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p rpm/SPECS rpm/BUILD rpm/RPMS rpm/SOURCES dist
          # 把安装树按 rpm 期望的布局放好
          mkdir -p rpm/pkgroot
          cp -R pkgroot/* rpm/pkgroot/
          {
            printf 'Name: mofumofu\n'
            printf 'Version: %s\n' "$VERSION"
            printf 'Release: 1%%{?dist}\n'
            printf 'Summary: Mofumofu Launcher - Minecraft launcher\n'
            printf 'License: MIT\n'
            printf 'BuildArch: x86_64\n'
            printf '%%description\n'
            printf 'Minecraft launcher based on .NET 10 + Avalonia UI (self-contained).\n'
            printf '%%files\n'
            printf '/usr/bin/mofumofu\n'
            printf '/usr/lib/mofumofu\n'
            printf '/usr/share/applications/mofumofu.desktop\n'
            printf '/usr/share/icons/hicolor/512x512/apps/mofumofu.png\n'
          } > rpm/SPECS/mofumofu.spec
          rpmbuild -bb \
            --define "_topdir $PWD/rpm" \
            --define "_sourcedir $PWD/rpm/pkgroot" \
            --define "_buildroot $PWD/rpm/pkgroot" \
            rpm/SPECS/mofumofu.spec || true
          find rpm/RPMS -name '*.rpm' -exec cp {} dist/ \; || true

      # ---------------- pkg.tar.zst (Arch / AUR) ----------------
      - name: Build pkg.tar.zst
        run: |
          sudo apt-get install -y zstd || (sudo apt-get update && sudo apt-get install -y zstd)
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p arch/mofumofu dist
          cp -R pkgroot/* arch/mofumofu/
          # .PKGINFO 是 pacman 需要的最小元数据（无 .MTREE 时 pacman -U 仅警告）
          {
            printf 'pkgname = mofumofu\n'
            printf 'pkgver = %s\n' "$VERSION"
            printf 'arch = x86_64\n'
            printf 'pkgdesc = Mofumofu Launcher - Minecraft launcher\n'
            printf 'url = https://github.com/redstore-noob/Mofumofu\n'
            printf 'license = MIT\n'
            printf 'depend = webkit2gtk-4.1\n'
            printf 'depend = libayatana-appindicator\n'
            printf 'depend = gtk3\n'
            printf 'size = %s\n' "$(du -sk arch/mofumofu | cut -f1)"
            printf 'builddate = %s\n' "$(date +%s)"
            printf 'packager = Mofumofu CI\n'
          } > arch/.PKGINFO
          # tar 整树 + .PKGINFO，zstd 压缩（在 arch/ 内打包，产物放回 dist/）
          cd arch
          tar -cf - .PKGINFO mofumofu | zstd -q -19 -o "../dist/mofumofu-${VERSION}-1-x86_64.pkg.tar.zst"
          cd ..
          echo "pkg 打包完成"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            dist/*.deb
            dist/*.rpm
            dist/*.pkg.tar.zst

  # ------------------------------------------------------------------
  # 汇总发布
  # ------------------------------------------------------------------
  release:
    name: GitHub Release
    needs: [windows, macos, linux]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/windows-artifacts/*
            artifacts/macos-artifacts/*
            artifacts/linux-artifacts/*
