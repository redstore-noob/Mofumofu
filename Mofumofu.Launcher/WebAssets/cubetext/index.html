<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3D text preview</title>
  <style>
    /* 颜色全部由宿主推过来的主题令牌（--mofu-*）驱动，页面自身不写死主题色 */
    :root {
      --mofu-surface: #0b1220;
      --mofu-text: #e9eef6;
      --mofu-muted: #93a0b4;
      --mofu-border: #26303d;
      --mofu-accent: #3fc6c1;
    }
    html, body {
      margin: 0; height: 100%; overflow: hidden;
      background: var(--mofu-surface);
    }
    body {
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      color: var(--mofu-text);
      user-select: none;
      -webkit-user-select: none;
    }
    #stage { position: absolute; inset: 0; cursor: grab; }
    #stage:active { cursor: grabbing; }
    #stage canvas { display: block; width: 100%; height: 100%; }
    .hud {
      position: absolute; left: 12px; bottom: 10px; right: 12px;
      display: flex; align-items: center; gap: 10px;
      font-size: 10.5px; color: var(--mofu-muted);
      pointer-events: none;
    }
    .hud .dot {
      width: 6px; height: 6px; border-radius: 3px;
      background: var(--mofu-accent); flex: none;
    }
    .hud .count { margin-left: auto; color: var(--mofu-muted); opacity: .85; }
    #loading {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: 12px; color: var(--mofu-muted);
      transition: opacity .2s ease;
      pointer-events: none;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
  </style>
</head>
<body>
  <div id="stage"><canvas id="scene"></canvas></div>
  <div class="hud">
    <span class="dot"></span>
    <span id="hint"></span>
    <span class="count" id="counter"></span>
  </div>
  <div id="loading"></div>
  <script src="./app.js"></script>
</body>
</html>
